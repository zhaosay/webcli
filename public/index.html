<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LAN Terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #09090b;
    --panel: #18181b;
    --border: #27272a;
    --border-glow: rgba(45, 212, 191, .35);
    --text: #fafafa;
    --muted: #a1a1aa;
    --accent: #14b8a6;
    --accent-hover: #2dd4bf;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
  }

  /* ---- token gate ---- */
  #gate {
    display: none;
    position: relative;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    overflow: hidden;
  }

  #gate::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 500px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(20, 184, 166, .16), transparent 70%);
    pointer-events: none;
  }

  .gate-card {
    position: relative;
    z-index: 1;
    width: 320px;
    padding: 32px 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
    box-shadow: 0 0 0 1px var(--border-glow), 0 20px 60px rgba(0, 0, 0, .5);
    text-align: center;
  }

  .gate-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-hover);
    margin-bottom: 8px;
  }

  .gate-title {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  #gate input {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: .5rem;
    border: 1px solid var(--border);
    background: #0f0f11;
    color: var(--text);
    outline: none;
  }
  #gate input:focus { border-color: var(--accent); }

  #gate button {
    width: 100%;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: .5rem;
    border: none;
    background: var(--accent);
    color: #04201c;
    cursor: pointer;
    transition: background .15s ease;
  }
  #gate button:hover { background: var(--accent-hover); }

  /* ---- terminal chrome ---- */
  #app {
    display: none;
    flex-direction: column;
    height: 100%;
  }

  #chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--border-glow);
  }
  #status-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, .4); }

  #address {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    min-width: 0;
  }

  #address-text {
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    letter-spacing: 0;
    text-transform: none;
  }

  #copy-btn {
    flex-shrink: 0;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    padding: 4px 10px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent-hover);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  #copy-btn:hover { background: rgba(45, 212, 191, .12); border-color: var(--accent); }
  #copy-btn.copied { color: var(--accent); border-color: var(--accent); }

  #terminal {
    flex: 1;
    min-height: 0;
    padding: 8px 10px;
    background: var(--bg);
  }
</style>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">Enter access token</div>
      <form id="gate-form">
        <input id="token-input" type="password" autocomplete="off" autofocus>
        <button type="submit">Connect</button>
      </form>
    </div>
  </div>

  <div id="app">
    <div id="chrome">
      <div id="status-dot"></div>
      <span id="status-text">webcli · connecting</span>
      <div id="address">
        <span id="address-text"></span>
        <button id="copy-btn" type="button">Copy</button>
      </div>
    </div>
    <div id="terminal"></div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('gate-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const v = document.getElementById('token-input').value.trim();
        if (!v) return;
        const url = new URL(location.href);
        url.searchParams.set('token', v);
        location.href = url.toString();
      });
    } else {
      document.getElementById('app').style.display = 'flex';

      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const setStatus = (connected, label) => {
        statusDot.classList.toggle('disconnected', !connected);
        statusText.textContent = `webcli · ${label}`;
      };

      const addressText = document.getElementById('address-text');
      const copyBtn = document.getElementById('copy-btn');
      addressText.textContent = location.href;
      addressText.title = location.href;
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.href);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = location.href;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyBtn.textContent = 'Copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 1500);
      });

      const term = new Terminal({
        cursorBlink: true,
        scrollback: 5000,
        fontFamily: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
        theme: {
          background: '#09090b',
          foreground: '#e4e4e7',
          cursor: '#2dd4bf',
          selectionBackground: 'rgba(45, 212, 191, .25)',
        },
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));
      fitAddon.fit();

      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/?token=${encodeURIComponent(token)}`);

      ws.onopen = () => {
        setStatus(true, 'connected');
        fitAddon.fit();
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      };
      ws.onmessage = (e) => term.write(e.data);
      ws.onclose = () => {
        setStatus(false, 'disconnected');
        term.write('\r\n\x1b[31m[connection closed]\x1b[0m\r\n');
      };
      ws.onerror = () => {
        setStatus(false, 'error');
        term.write('\r\n\x1b[31m[connection error]\x1b[0m\r\n');
      };

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });

      window.addEventListener('resize', () => {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      });
    }
  </script>
</body>
</html>
