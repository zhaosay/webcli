<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Without this the page renders at a 980px desktop width and then scales
     down, which makes the terminal unreadably small on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="webcli">
<meta name="referrer" content="no-referrer">
<title>webcli</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #09090b;
    --panel: #18181b;
    --border: #27272a;
    --border-glow: rgba(45, 212, 191, .35);
    --text: #fafafa;
    --muted: #a1a1aa;
    --input-bg: #0f0f11;
    --accent: #14b8a6;
    --accent-hover: #2dd4bf;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  :root[data-theme="light"] {
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #e4e4e7;
    --border-glow: rgba(13, 148, 136, .25);
    --text: #18181b;
    --muted: #71717a;
    --input-bg: #ffffff;
    --accent: #0d9488;
    --accent-hover: #0f766e;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --border: #e4e4e7;
      --border-glow: rgba(13, 148, 136, .25);
      --text: #18181b;
      --muted: #71717a;
      --input-bg: #ffffff;
      --accent: #0d9488;
      --accent-hover: #0f766e;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    /* 100% (and 100vh) on mobile browsers is the "chrome collapsed" size, which
       doesn't match the currently-visible area while the address bar is shown.
       That mismatch lets the page scroll by a hair, which toggles the address
       bar, which fires a resize event, which we react to — a feedback loop
       that reads as the whole UI flickering up and down. 100dvh tracks the
       actual visible viewport instead, so there's nothing to scroll into. */
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    transition: background .15s ease, color .15s ease;
    overflow: hidden;
  }

  /* ---- token gate ---- */
  #gate, #key-gate, #device-gate {
    display: none;
    position: relative;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    overflow: hidden;
  }

  #gate::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 500px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(20, 184, 166, .16), transparent 70%);
    pointer-events: none;
  }

  .gate-card {
    position: relative;
    z-index: 1;
    width: 320px;
    padding: 32px 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
    box-shadow: 0 0 0 1px var(--border-glow), 0 20px 60px rgba(0, 0, 0, .5);
    text-align: center;
    animation: gate-in .35s ease;
  }

  @keyframes gate-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gate-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-hover);
    margin-bottom: 8px;
  }

  .gate-title {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .gate-card input {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: .5rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  .gate-card input:focus { border-color: var(--accent); }

  .gate-card button {
    width: 100%;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: .5rem;
    border: none;
    background: var(--accent);
    color: #04201c;
    cursor: pointer;
    transition: background .15s ease;
  }
  .gate-card button:hover { background: var(--accent-hover); }
  .gate-card .gate-actions { display: flex; gap: 8px; }
  .gate-card .gate-actions button { flex: 1; }
  .gate-card .gate-skip { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .gate-card .gate-skip:hover { background: rgba(255, 255, 255, .06); color: var(--text); }

  /* ---- app chrome ---- */
  #app {
    display: none;
    flex-direction: column;
    height: 100%;
  }

  #chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chrome-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-radius: .25rem;
    padding: 2px 4px;
    margin: -2px -4px;
  }
  .chrome-title:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .1); }

  #version-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    opacity: .7;
  }

  .chrome-title-input {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: .25rem;
    padding: 2px 4px;
    margin: -2px -4px;
    outline: none;
    width: 160px;
  }

  /* ---- dropdown panels shared look (connections / settings) ---- */
  .chrome-dropdown-anchor { position: relative; }
  .chrome-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 10;
    min-width: 220px;
    max-width: 320px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .5rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    cursor: default;
    opacity: 0;
    visibility: hidden;
    transform: scale(.96) translateY(-4px);
    transform-origin: top right;
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
  }
  .chrome-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1) translateY(0);
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear 0s;
  }

  #connections-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    padding: 3px 7px;
    border-radius: .375rem;
    cursor: pointer;
  }
  #connections-badge:hover { background: rgba(127, 127, 127, .1); color: var(--text); }
  #connections-badge .conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--border-glow);
  }
  .conn-row {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 8px;
    border-radius: .375rem;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .conn-row:hover { background: rgba(127, 127, 127, .1); }
  .conn-row .conn-device { color: var(--text); }
  .conn-row .conn-meta { color: var(--muted); font-size: 10px; }

  #settings-btn, #quickcmd-btn {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: .375rem;
    padding: 5px 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  #settings-btn { font-size: 15px; font-weight: 400; }
  #settings-btn:hover, #quickcmd-btn:hover { background: rgba(127, 127, 127, .1); color: var(--text); }

  #quickcmd-bar { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; overflow-x: auto; max-width: 40vw; }
  .quickcmd-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: .375rem;
    padding: 4px 6px 4px 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .quickcmd-chip:hover { background: rgba(127, 127, 127, .1); color: var(--text); }
  .quickcmd-chip .quickcmd-chip-label {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .quickcmd-chip .quickcmd-chip-del {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 1px 2px;
    border-radius: .25rem;
  }
  .quickcmd-chip .quickcmd-chip-del:hover { color: var(--text); background: rgba(127, 127, 127, .2); }

  /* ---- add-quick-command modal ---- */
  #quickcmd-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .7);
    padding: 20px;
  }
  #quickcmd-modal.show { display: flex; }
  #quickcmd-modal .quickcmd-card {
    width: min(320px, 100%);
    max-height: 90dvh;
    overflow: auto;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
  }
  #quickcmd-modal h3 { margin: 0 0 14px; font-size: 15px; color: var(--text); }
  #quickcmd-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #quickcmd-form input {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 9px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #quickcmd-form input:focus { border-color: var(--accent); }
  #quickcmd-modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  #quickcmd-modal-actions button { flex: 1; }
  #quickcmd-form button[type="submit"] {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 7px;
    border-radius: .375rem;
    border: none;
    background: var(--accent);
    color: #04201c;
    cursor: pointer;
  }
  #quickcmd-form button[type="submit"]:hover { background: var(--accent-hover); }
  #quickcmd-cancel {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 7px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  #quickcmd-cancel:hover { background: rgba(127, 127, 127, .1); color: var(--text); }

  #settings-dropdown .settings-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 2px 4px 6px;
  }
  .theme-switch, .action-row {
    display: flex;
    gap: 3px;
    padding: 3px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: .375rem;
  }
  .theme-switch button, .action-row button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 4px;
    border-radius: .3rem;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-switch button:hover, .action-row button:hover { color: var(--text); }
  .theme-switch button.active { background: var(--accent); color: #04201c; }
  .settings-divider { height: 1px; background: var(--border); margin: 8px 2px; }
  #version-info {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    padding: 0 4px;
  }
  #service-action-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    padding: 6px 4px 0;
    min-height: 1.4em;
  }

  #copy-link-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent-hover);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  #copy-link-btn:hover { background: rgba(45, 212, 191, .12); border-color: var(--accent); }
  #copy-link-btn.copied { color: var(--accent); border-color: var(--accent); }

  /* ---- tab bar ---- */
  #tabbar {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }

  #tabs { display: flex; }

  .tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 8px 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .tab.active { color: var(--text); background: var(--bg); }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--accent);
  }

  .tab-label-input {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: .25rem;
    padding: 1px 3px;
    outline: none;
    width: 100px;
  }

  .tab-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #71717a;
    flex-shrink: 0;
  }
  .tab-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--border-glow); }
  .tab-dot.disconnected { background: #f59e0b; animation: dot-pulse 1.2s ease-in-out infinite; }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .tab-close {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 3px;
    border-radius: .25rem;
  }
  .tab-close:hover { color: var(--text); background: rgba(255, 255, 255, .08); }

  #new-tab-btn {
    flex-shrink: 0;
    width: 34px;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }
  #new-tab-btn:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .08); }
  #new-tab-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ---- terminal panes ---- */
  #panes {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--bg);
  }

  .pane {
    position: absolute;
    inset: 0;
    padding: 8px 10px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .15s ease, visibility 0s linear .15s;
  }
  .pane.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .15s ease, visibility 0s linear 0s;
  }

  #empty-state {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: var(--muted);
  }
  #empty-state.show { display: flex; }
  #empty-state .empty-icon {
    font-family: var(--font-mono);
    font-size: 30px;
    color: var(--border);
    margin-bottom: 2px;
  }
  #empty-state .empty-title {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text);
  }
  #empty-state .empty-hint {
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ---- search overlay ---- */
  #search-bar {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .5rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  #search-bar.show { display: flex; }
  #search-bar input {
    width: 160px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 6px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #search-bar input:focus { border-color: var(--accent); }
  #search-bar button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: .25rem;
  }
  #search-bar button:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .1); }

  /* ---- mobile key row ---- */
  #mobile-keys {
    display: none;
    gap: 6px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  #mobile-keys button {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    cursor: pointer;
  }
  #mobile-keys button:active { background: rgba(45, 212, 191, .15); border-color: var(--accent); }
  /* Ctrl/Alt latch on until the next keypress, so two-finger chords aren't
     needed on a touchscreen. */
  #mobile-keys button.sticky-on {
    background: var(--accent);
    color: #04201c;
    border-color: var(--accent);
  }
  #mobile-keys::-webkit-scrollbar { display: none; }

  @media (max-width: 700px) {
    #mobile-keys { display: flex; }
    #mobile-keys button { min-width: 42px; padding: 9px 12px; }
  }
  #mobile-keys.force-show { display: flex; }
  #mobile-keys.force-hide { display: none; }

  /* ---- drag & drop upload ---- */
  #drop-hint {
    display: none;
    position: absolute;
    inset: 8px;
    z-index: 20;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--accent);
    border-radius: .75rem;
    background: rgba(20, 184, 166, .1);
    color: var(--accent-hover);
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
  }
  #drop-hint.show { display: flex; }

  /* ---- share / QR modal ---- */
  #qr-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .7);
    padding: 20px;
  }
  #qr-modal.show { display: flex; }
  #qr-modal .qr-card {
    width: min(340px, 100%);
    max-height: 90dvh;
    overflow: auto;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
    text-align: center;
  }
  #qr-modal h3 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
  #qr-modal p { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  #qr-modal svg { width: 100%; height: auto; border-radius: .5rem; background: #fff; }
  #qr-url {
    margin: 12px 0;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    word-break: break-all;
    color: var(--muted);
    background: var(--input-bg);
    border-radius: .375rem;
  }
</style>
<script>
  (function () {
    var t = localStorage.getItem('webcli-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">Enter access token</div>
      <form id="gate-form">
        <input id="token-input" type="password" autocomplete="off" autofocus>
        <button type="submit">Connect</button>
      </form>
    </div>
  </div>

  <div id="key-gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">Enter secondary key</div>
      <form id="key-gate-form">
        <input id="key-input" type="password" autocomplete="off" autofocus>
        <button type="submit">Continue</button>
      </form>
    </div>
  </div>

  <div id="device-gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">这台设备叫什么名字？<br>（方便对方知道是谁连上来了，可不填）</div>
      <form id="device-gate-form">
        <input id="device-input" type="text" maxlength="40" autocomplete="off" autofocus placeholder="比如：我的 iPhone">
        <div class="gate-actions">
          <button type="button" class="gate-skip" id="device-skip">跳过</button>
          <button type="submit">确定</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app">
    <div id="chrome">
      <span class="chrome-title" id="chrome-title" title="点击重命名">webcli</span>
      <span id="version-badge" title="点击 ⋯ 菜单看提交号和时间"></span>
      <div id="quickcmd-bar"></div>
      <button id="quickcmd-btn" type="button" title="新增快捷命令">+</button>
      <div id="connections-badge" class="chrome-dropdown-anchor" title="点击查看当前连接">
        <span class="conn-dot"></span>
        <span id="conn-count">1</span>
        <div id="connections-dropdown" class="chrome-dropdown"></div>
      </div>
      <div id="settings-badge" class="chrome-dropdown-anchor">
        <button id="settings-btn" type="button" title="设置">&#8943;</button>
        <div id="settings-dropdown" class="chrome-dropdown">
          <div class="settings-label">主题</div>
          <div class="theme-switch">
            <button type="button" data-theme-choice="auto">跟随系统</button>
            <button type="button" data-theme-choice="light">浅色</button>
            <button type="button" data-theme-choice="dark">深色</button>
          </div>
          <div class="settings-divider"></div>
          <div id="version-info"></div>
          <div class="settings-divider"></div>
          <div class="settings-label">服务</div>
          <div class="action-row">
            <button type="button" id="update-btn">更新代码</button>
            <button type="button" id="restart-btn">重启服务</button>
          </div>
          <div id="service-action-status" class="settings-meta"></div>
        </div>
      </div>
      <button id="qr-btn" type="button" title="扫码在手机上打开">&#9636;</button>
      <button id="copy-link-btn" type="button">复制链接</button>
    </div>
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="new-tab-btn" type="button" title="New terminal">+</button>
    </div>
    <div id="mobile-keys">
      <button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-sticky="ctrl">Ctrl</button>
      <button type="button" data-sticky="alt">Alt</button>
      <button type="button" data-key="ctrl-c">^C</button>
      <button type="button" data-key="ctrl-d">^D</button>
      <button type="button" data-key="ctrl-z">^Z</button>
      <button type="button" data-key="left">&larr;</button>
      <button type="button" data-key="up">&uarr;</button>
      <button type="button" data-key="down">&darr;</button>
      <button type="button" data-key="right">&rarr;</button>
      <button type="button" data-key="home">Home</button>
      <button type="button" data-key="end">End</button>
      <button type="button" data-key="pgup">PgUp</button>
      <button type="button" data-key="pgdn">PgDn</button>
      <button type="button" data-key="dash">-</button>
      <button type="button" data-key="underscore">_</button>
      <button type="button" data-key="slash">/</button>
      <button type="button" data-key="pipe">|</button>
      <button type="button" data-key="tilde">~</button>
      <button type="button" data-key="star">*</button>
    </div>
    <div id="panes">
      <div id="empty-state">
        <div class="empty-icon">&gt;_</div>
        <div class="empty-title">还没有打开的终端</div>
        <div class="empty-hint">点击左上角 <strong>+</strong> 开一个</div>
      </div>
      <div id="drop-hint">松手上传到 ~/webcli-uploads</div>
      <div id="qr-modal">
        <div class="qr-card">
          <h3>扫码在手机上打开</h3>
          <p>链接含 token，请勿公开分享</p>
          <div id="qr-box"></div>
          <div id="qr-url"></div>
          <button id="qr-close" type="button">关闭</button>
        </div>
      </div>
      <div id="quickcmd-modal">
        <div class="quickcmd-card">
          <h3>新增快捷命令</h3>
          <form id="quickcmd-form">
            <input id="quickcmd-label-input" type="text" placeholder="名称" maxlength="20" autocomplete="off" required>
            <input id="quickcmd-command-input" type="text" placeholder="命令内容" maxlength="200" autocomplete="off" required>
            <input id="quickcmd-cwd-input" type="text" placeholder="工作目录（可选）" maxlength="200" autocomplete="off">
            <div id="quickcmd-modal-actions">
              <button type="button" id="quickcmd-cancel">取消</button>
              <button type="submit">添加</button>
            </div>
          </form>
        </div>
      </div>
      <div id="search-bar">
        <input id="search-input" type="text" placeholder="Find in terminal…" autocomplete="off">
        <button id="search-prev" type="button" title="Previous match">&uarr;</button>
        <button id="search-next" type="button" title="Next match">&darr;</button>
        <button id="search-close" type="button" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-search.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const DEVICE_NAME_STORAGE = 'webcli-device-name';

    if (!token) {
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('gate-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const v = document.getElementById('token-input').value.trim();
        if (!v) return;
        const url = new URL(location.href);
        url.searchParams.set('token', v);
        location.href = url.toString();
      });
    } else {
      function initApp(secondaryKey) {
      document.getElementById('app').style.display = 'flex';

      const chromeTitle = document.getElementById('chrome-title');
      const applyName = (name) => {
        document.title = name;
        chromeTitle.textContent = name;
      };
      fetch('/api/name').then((r) => r.json()).then(({ name }) => { if (name) applyName(name); }).catch(() => {});

      const versionInfo = document.getElementById('version-info');
      const versionBadge = document.getElementById('version-badge');
      fetch('/api/version').then((r) => r.json()).then(({ version, commit, commitDate }) => {
        const label = `v${version}${commit ? ' · ' + commit : ''}`;
        versionInfo.textContent = label;
        versionBadge.textContent = `v${version}`;
        if (commitDate) versionInfo.title = commitDate;
      }).catch(() => {});

      const connBadge = document.getElementById('connections-badge');
      const connCount = document.getElementById('conn-count');
      const connDropdown = document.getElementById('connections-dropdown');
      const settingsBtn = document.getElementById('settings-btn');
      const settingsDropdown = document.getElementById('settings-dropdown');
      const authQuery = `token=${encodeURIComponent(token)}${secondaryKey ? '&key=' + encodeURIComponent(secondaryKey) : ''}`;

      function closeAllDropdowns() {
        connDropdown.classList.remove('show');
        settingsDropdown.classList.remove('show');
      }

      function formatAgo(ts) {
        const mins = Math.floor(Math.max(0, Date.now() - ts) / 60000);
        if (mins < 1) return '刚刚';
        if (mins < 60) return `${mins} 分钟前`;
        const hours = Math.floor(mins / 60);
        if (hours < 24) return `${hours} 小时前`;
        return `${Math.floor(hours / 24)} 天前`;
      }

      function refreshConnections() {
        fetch(`/api/connections?${authQuery}`).then((r) => r.json()).then(({ connections }) => {
          if (!Array.isArray(connections)) return;
          connCount.textContent = connections.length;
          connDropdown.innerHTML = '';
          connections.forEach((c) => {
            const row = document.createElement('div');
            row.className = 'conn-row';
            const device = document.createElement('div');
            device.className = 'conn-device';
            device.textContent = c.device || '未命名设备';
            const meta = document.createElement('div');
            meta.className = 'conn-meta';
            meta.textContent = `${c.ip || '未知 IP'} · ${formatAgo(c.connectedAt)}`;
            row.appendChild(device);
            row.appendChild(meta);
            connDropdown.appendChild(row);
          });
        }).catch(() => {});
      }
      connBadge.addEventListener('click', (e) => {
        e.stopPropagation();
        const willShow = !connDropdown.classList.contains('show');
        closeAllDropdowns();
        connDropdown.classList.toggle('show', willShow);
        if (willShow) refreshConnections();
      });
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willShow = !settingsDropdown.classList.contains('show');
        closeAllDropdowns();
        settingsDropdown.classList.toggle('show', willShow);
      });
      // Without this, clicking update/restart (or anything else in here)
      // bubbles to the document listener below and closes the menu on the
      // same click — hiding the "重启中…" status line right as it appears.
      settingsDropdown.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', closeAllDropdowns);
      refreshConnections();
      setInterval(refreshConnections, 15000);

      const QUICKCMD_STORAGE = 'webcli-quick-commands';
      const quickcmdBar = document.getElementById('quickcmd-bar');
      const quickcmdBtn = document.getElementById('quickcmd-btn');
      const quickcmdModal = document.getElementById('quickcmd-modal');
      const quickcmdForm = document.getElementById('quickcmd-form');
      const quickcmdLabelInput = document.getElementById('quickcmd-label-input');
      const quickcmdCommandInput = document.getElementById('quickcmd-command-input');
      const quickcmdCwdInput = document.getElementById('quickcmd-cwd-input');
      const quickcmdCancelBtn = document.getElementById('quickcmd-cancel');

      function loadQuickCommands() {
        try {
          const parsed = JSON.parse(localStorage.getItem(QUICKCMD_STORAGE) || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }
      function saveQuickCommands(list) {
        localStorage.setItem(QUICKCMD_STORAGE, JSON.stringify(list));
      }
      function runQuickCommand(item) {
        const session = currentSession();
        if (!session || !session.ws || session.ws.readyState !== WebSocket.OPEN) return;
        // A latched Ctrl/Alt from the mobile key row must not leak into a canned
        // command — drop the modifiers rather than mangling the first character.
        setSticky('ctrl', false);
        setSticky('alt', false);
        const command = item.cwd ? `cd "${item.cwd}" && ${item.command}` : item.command;
        session.ws.send(JSON.stringify({ type: 'input', data: command + '\n' }));
        session.term.focus();
      }
      function renderQuickCommands() {
        const list = loadQuickCommands();
        quickcmdBar.innerHTML = '';
        list.forEach((item) => {
          const chip = document.createElement('div');
          chip.className = 'quickcmd-chip';
          chip.title = item.cwd ? `cd "${item.cwd}" && ${item.command}` : item.command;
          const label = document.createElement('span');
          label.className = 'quickcmd-chip-label';
          label.textContent = item.label;
          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'quickcmd-chip-del';
          del.textContent = '×';
          del.title = '删除';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            saveQuickCommands(loadQuickCommands().filter((c) => c.id !== item.id));
            renderQuickCommands();
          });
          chip.appendChild(label);
          chip.appendChild(del);
          chip.addEventListener('click', () => runQuickCommand(item));
          quickcmdBar.appendChild(chip);
        });
      }
      quickcmdBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeAllDropdowns();
        quickcmdLabelInput.value = '';
        quickcmdCommandInput.value = '';
        quickcmdCwdInput.value = '';
        quickcmdModal.classList.add('show');
        quickcmdLabelInput.focus();
      });
      quickcmdModal.addEventListener('click', (e) => {
        if (e.target === quickcmdModal) quickcmdModal.classList.remove('show');
      });
      quickcmdCancelBtn.addEventListener('click', () => quickcmdModal.classList.remove('show'));
      quickcmdForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const label = quickcmdLabelInput.value.trim();
        const command = quickcmdCommandInput.value.trim();
        const cwd = quickcmdCwdInput.value.trim();
        if (!label || !command) return;
        const list = loadQuickCommands();
        list.push({ id: newSid(), label, command, cwd });
        saveQuickCommands(list);
        quickcmdModal.classList.remove('show');
        renderQuickCommands();
      });
      renderQuickCommands();

      const THEME_STORAGE = 'webcli-theme';
      const themeButtons = document.querySelectorAll('.theme-switch button');
      function applyTheme(choice) {
        if (choice === 'auto') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', choice);
        themeButtons.forEach((b) => b.classList.toggle('active', b.dataset.themeChoice === choice));
      }
      themeButtons.forEach((b) => b.addEventListener('click', () => {
        localStorage.setItem(THEME_STORAGE, b.dataset.themeChoice);
        applyTheme(b.dataset.themeChoice);
      }));
      applyTheme(localStorage.getItem(THEME_STORAGE) || 'auto');

      const serviceActionStatus = document.getElementById('service-action-status');
      const updateBtn = document.getElementById('update-btn');
      const restartBtn = document.getElementById('restart-btn');

      // The server that answers this POST is the one about to be killed and
      // replaced, so there's no live channel back with a "how did it go".
      // Once it responds (meaning the detached script was launched), poll
      // /api/version until a server answers again, then reload so the page
      // picks up whatever changed.
      function waitForServerThenReload() {
        serviceActionStatus.textContent = '重启中，请稍候…';
        let attempts = 0;
        const poll = setInterval(() => {
          attempts += 1;
          fetch('/api/version').then((r) => {
            if (!r.ok) throw new Error('not ready');
            clearInterval(poll);
            serviceActionStatus.textContent = '已恢复，正在刷新…';
            setTimeout(() => location.reload(), 400);
          }).catch(() => {
            if (attempts >= 60) {
              clearInterval(poll);
              serviceActionStatus.textContent = '等待超时，请手动刷新页面确认状态';
            }
          });
        }, 1500);
      }

      function triggerServiceAction(btn, path, label) {
        updateBtn.disabled = true;
        restartBtn.disabled = true;
        serviceActionStatus.textContent = `正在${label}…`;
        fetch(`${path}?${authQuery}`, { method: 'POST' })
          .then((r) => {
            if (!r.ok) throw new Error('request failed');
            // Give the detached script a moment to actually stop the old
            // process before we start polling, or the first few polls would
            // just hit the still-running (soon to be replaced) instance.
            setTimeout(waitForServerThenReload, 1000);
          })
          .catch(() => {
            serviceActionStatus.textContent = '请求失败，请检查终端日志';
            updateBtn.disabled = false;
            restartBtn.disabled = false;
          });
      }
      updateBtn.addEventListener('click', () => triggerServiceAction(updateBtn, '/api/update', '更新代码'));
      restartBtn.addEventListener('click', () => triggerServiceAction(restartBtn, '/api/restart', '重启服务'));

      chromeTitle.addEventListener('click', () => {
        const current = chromeTitle.textContent;
        const input = document.createElement('input');
        input.type = 'text';
        input.value = current;
        input.maxLength = 40;
        input.className = 'chrome-title-input';
        chromeTitle.replaceWith(input);
        input.focus();
        input.select();

        const commit = async () => {
          const value = input.value.trim();
          input.replaceWith(chromeTitle);
          if (!value || value === current) {
            applyName(current);
            return;
          }
          try {
            const res = await fetch(`/api/name?token=${encodeURIComponent(token)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: value }),
            });
            const data = await res.json();
            applyName(data.name || current);
          } catch {
            applyName(current);
          }
        };
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape') { input.value = current; input.blur(); }
        });
        input.addEventListener('blur', commit, { once: true });
      });

      const copyLinkBtn = document.getElementById('copy-link-btn');
      const copyLinkLabel = '复制链接';
      const copyLinkCopiedLabel = '已复制';
      copyLinkBtn.title = location.href;
      copyLinkBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(location.href);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = location.href;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        copyLinkBtn.innerHTML = copyLinkCopiedLabel;
        copyLinkBtn.classList.add('copied');
        setTimeout(() => {
          copyLinkBtn.innerHTML = copyLinkLabel;
          copyLinkBtn.classList.remove('copied');
        }, 1500);
      });

      const MAX_SESSIONS = 10;
      const tabsEl = document.getElementById('tabs');
      const panesEl = document.getElementById('panes');
      const emptyStateEl = document.getElementById('empty-state');
      const newTabBtn = document.getElementById('new-tab-btn');

      const sessions = new Map();
      let sessionCounter = 0;
      let activeId = null;

      function updateEmptyState() {
        emptyStateEl.classList.toggle('show', sessions.size === 0);
      }

      function updateNewTabBtn() {
        newTabBtn.disabled = sessions.size >= MAX_SESSIONS;
      }

      function sendResize(session) {
        if (session.ws && session.ws.readyState === WebSocket.OPEN) {
          session.ws.send(JSON.stringify({ type: 'resize', cols: session.term.cols, rows: session.term.rows }));
        }
      }

      function currentSession() {
        return sessions.get(activeId);
      }

      const searchBar = document.getElementById('search-bar');
      const searchInput = document.getElementById('search-input');

      function openSearch() {
        if (!currentSession()) return;
        searchBar.classList.add('show');
        searchInput.focus();
        searchInput.select();
      }
      function closeSearch() {
        searchBar.classList.remove('show');
        const session = currentSession();
        if (session) session.term.focus();
      }
      function runSearch(dir) {
        const session = currentSession();
        if (!session || !searchInput.value) return;
        if (dir === 'prev') session.searchAddon.findPrevious(searchInput.value);
        else session.searchAddon.findNext(searchInput.value);
      }
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); runSearch(e.shiftKey ? 'prev' : 'next'); }
        if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
      });
      document.getElementById('search-next').addEventListener('click', () => runSearch('next'));
      document.getElementById('search-prev').addEventListener('click', () => runSearch('prev'));
      document.getElementById('search-close').addEventListener('click', closeSearch);

      const MOBILE_KEY_SEQ = {
        esc: '\x1b', tab: '\t', 'ctrl-c': '\x03', 'ctrl-d': '\x04', 'ctrl-z': '\x1a',
        up: '\x1b[A', down: '\x1b[B', left: '\x1b[D', right: '\x1b[C',
        home: '\x1b[H', end: '\x1b[F', pgup: '\x1b[5~', pgdn: '\x1b[6~',
        dash: '-', underscore: '_', slash: '/', pipe: '|', tilde: '~', star: '*',
      };

      // Ctrl and Alt latch instead of needing to be held: tap Ctrl, then a
      // letter, and the two are combined. Soft keyboards never emit real
      // keydown events for letters, so the combining happens in term.onData.
      let stickyCtrl = false;
      let stickyAlt = false;

      function setSticky(which, on) {
        if (which === 'ctrl') stickyCtrl = on; else stickyAlt = on;
        document.querySelectorAll('#mobile-keys button[data-sticky]').forEach((b) => {
          b.classList.toggle('sticky-on', b.dataset.sticky === 'ctrl' ? stickyCtrl : stickyAlt);
        });
      }

      /** Applies any latched modifier, then sends the data to the shell. */
      function sendInput(session, data) {
        if (!session || !session.ws || session.ws.readyState !== WebSocket.OPEN) return;
        let out = data;
        // Latch is consumed by the *next* input regardless of its shape —
        // otherwise a paste (length !== 1) skipped the combining logic below
        // but also skipped clearing stickyCtrl, leaving it latched to
        // silently Ctrl-combine the next unrelated keystroke.
        if (stickyCtrl) {
          if (out.length === 1) {
            const c = out.toUpperCase().charCodeAt(0);
            if (c >= 64 && c <= 95) out = String.fromCharCode(c - 64);
            else if (c === 63) out = '\x7f';
          }
          setSticky('ctrl', false);
        }
        if (stickyAlt) {
          if (out.length >= 1) out = '\x1b' + out;
          setSticky('alt', false);
        }
        session.ws.send(JSON.stringify({ type: 'input', data: out }));
      }

      document.getElementById('mobile-keys').addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        // never take focus: that would dismiss the on-screen keyboard
        e.preventDefault();
        if (btn.dataset.sticky) {
          setSticky(btn.dataset.sticky, btn.dataset.sticky === 'ctrl' ? !stickyCtrl : !stickyAlt);
          return;
        }
        const session = currentSession();
        if (!session) return;
        const seq = MOBILE_KEY_SEQ[btn.dataset.key];
        if (seq) sendInput(session, seq);
      });

      // Sessions live on the server, so remembering their ids lets a page
      // reload (or a second device opening the same link) pick the running
      // terminals back up instead of silently orphaning them.
      const SIDS_STORAGE = 'webcli-sids';
      function loadSids() {
        try {
          const v = JSON.parse(localStorage.getItem(SIDS_STORAGE) || '[]');
          return Array.isArray(v) ? v.filter((s) => typeof s === 'string') : [];
        } catch { return []; }
      }
      function saveSids() {
        const live = [...sessions.values()].map((s) => s.sid).filter(Boolean);
        try { localStorage.setItem(SIDS_STORAGE, JSON.stringify(live)); } catch {}
      }

      function newSid() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function connectWs(session) {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const keyParam = secondaryKey ? `&key=${encodeURIComponent(secondaryKey)}` : '';
        const deviceName = localStorage.getItem(DEVICE_NAME_STORAGE) || '';
        const deviceParam = deviceName ? `&device=${encodeURIComponent(deviceName)}` : '';
        const dims = `&cols=${session.term.cols}&rows=${session.term.rows}`;
        const ws = new WebSocket(`${proto}://${location.host}/?token=${encodeURIComponent(token)}&sid=${encodeURIComponent(session.sid)}${keyParam}${deviceParam}${dims}`);
        ws.binaryType = 'arraybuffer';
        session.ws = ws;

        const setDot = (state) => { session.dot.className = `tab-dot ${state}`; };

        ws.onopen = () => {
          setDot('connected');
          const wasReconnect = session.reconnectAttempts > 0;
          session.reconnectAttempts = 0;
          if (wasReconnect) session.term.write('\r\n\x1b[2m[reconnected]\x1b[0m\r\n');
          // Panes stay in layout (hidden via opacity, not display:none) so
          // fit() reports a real size even for an inactive tab — always fit
          // on connect. Gating this on "is this the active tab" broke
          // multi-tab restore: createSession() reassigns activeId to each
          // new tab as it's created, so every tab but the last one would
          // see activeId !== its own id by the time its socket actually
          // opened, and stay stuck at whatever default size it was created
          // with.
          session.fitAddon.fit();
          sendResize(session);
        };
        // Binary frames are terminal bytes; text frames are JSON control
        // messages (tab titles, resume info).
        ws.onmessage = (e) => {
          if (typeof e.data === 'string') {
            let msg;
            try { msg = JSON.parse(e.data); } catch { return; }
            if (msg.type === 'hello') {
              if (msg.resumed) session.term.reset();
              if (msg.title) applyAutoTitle(session, msg.title);
              saveSids();
            } else if (msg.type === 'title') {
              applyAutoTitle(session, msg.title);
            }
            return;
          }
          session.term.write(new Uint8Array(e.data));
        };
        ws.onclose = () => {
          setDot('disconnected');
          if (session.closing) return;
          // Print once on the initial drop, not on every failed retry (a
          // failed connection attempt also fires 'close', so without this
          // guard a server that's genuinely down would spam this line every
          // few seconds forever). After enough retries in a row (~35s of
          // backoff), a network blip is a much less likely explanation than
          // the service having actually been stopped, so say so once.
          if (session.reconnectAttempts === 0) {
            session.term.write('\r\n\x1b[31m[connection lost, reconnecting…]\x1b[0m\r\n');
          } else if (session.reconnectAttempts === 6) {
            session.term.write('\r\n\x1b[33m[长时间连不上，服务端可能已经关闭，仍会继续自动重试]\x1b[0m\r\n');
          }
          const delay = Math.min(1000 * 2 ** session.reconnectAttempts, 10000);
          session.reconnectAttempts += 1;
          session.reconnectTimer = setTimeout(() => {
            if (!session.closing) connectWs(session);
          }, delay);
        };
        ws.onerror = () => {
          setDot('disconnected');
        };
      }

      function activateSession(id) {
        activeId = id;
        panesEl.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.dataset.id === String(id)));
        tabsEl.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.id === String(id)));
        const session = sessions.get(id);
        if (session) {
          session.fitAddon.fit();
          session.term.focus();
          sendResize(session);
        }
      }

      function closeSession(id) {
        const session = sessions.get(id);
        if (!session) return;
        session.closing = true;
        if (session.reconnectTimer) clearTimeout(session.reconnectTimer);
        if (session.ws) {
          // Closing a tab by hand means "kill the shell"; a dropped connection
          // does not, which is what the reconnect grace period is for.
          if (session.ws.readyState === WebSocket.OPEN) {
            session.ws.send(JSON.stringify({ type: 'kill' }));
          }
          session.ws.close();
        }
        session.pane.remove();
        session.tabEl.remove();
        sessions.delete(id);
        saveSids();
        updateEmptyState();
        updateNewTabBtn();
        if (activeId === id) {
          const remaining = [...sessions.keys()];
          activeId = null;
          if (remaining.length) activateSession(remaining[remaining.length - 1]);
        }
      }

      // Tabs are labelled with the foreground process (zsh -> vim -> top) until
      // the user renames one by hand, at which point their name wins.
      function applyAutoTitle(session, title) {
        if (!title || session.renamed) return;
        session.labelEl.textContent = title;
        session.labelEl.title = '双击重命名';
      }

      function createSession(existingSid) {
        if (sessions.size >= MAX_SESSIONS) return;
        const id = ++sessionCounter;

        const pane = document.createElement('div');
        pane.className = 'pane';
        pane.dataset.id = String(id);
        panesEl.appendChild(pane);

        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.dataset.id = String(id);
        tabEl.innerHTML = '<span class="tab-dot"></span><span class="tab-label"></span><button class="tab-close" type="button">&times;</button>';
        const tabLabelEl = tabEl.querySelector('.tab-label');
        tabLabelEl.textContent = `webcli-${id}`;
        tabLabelEl.title = '双击重命名';
        tabLabelEl.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const current = tabLabelEl.textContent;
          const input = document.createElement('input');
          input.type = 'text';
          input.value = current;
          input.maxLength = 40;
          input.className = 'tab-label-input';
          tabLabelEl.replaceWith(input);
          input.focus();
          input.select();
          input.addEventListener('click', (ev) => ev.stopPropagation());
          const commit = () => {
            const value = input.value.trim();
            input.replaceWith(tabLabelEl);
            tabLabelEl.textContent = value || current;
            // a hand-picked name pins the tab; stop overwriting it with the
            // foreground process name
            const s = sessions.get(id);
            if (s && value) s.renamed = true;
          };
          input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') input.blur();
            if (ev.key === 'Escape') { input.value = current; input.blur(); }
          });
          input.addEventListener('blur', commit, { once: true });
        });
        tabsEl.appendChild(tabEl);

        const term = new Terminal({
          cursorBlink: true,
          scrollback: 5000,
          fontFamily: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
          theme: {
            background: '#09090b',
            foreground: '#e4e4e7',
            cursor: '#2dd4bf',
            selectionBackground: 'rgba(45, 212, 191, .25)',
          },
        });
        const fitAddon = new FitAddon.FitAddon();
        const searchAddon = new SearchAddon.SearchAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(searchAddon);
        term.open(pane);

        term.attachCustomKeyEventHandler((e) => {
          if (e.type !== 'keydown') return true;
          const mod = e.ctrlKey || e.metaKey;
          if (mod && e.key.toLowerCase() === 'f') {
            e.preventDefault();
            activateSession(id);
            openSearch();
            return false;
          }
          if (e.key === 'Escape' && searchBar.classList.contains('show')) {
            e.preventDefault();
            closeSearch();
            return false;
          }
          return true;
        });

        const session = {
          id, sid: existingSid || newSid(), term, fitAddon, searchAddon, ws: null, pane, tabEl,
          dot: tabEl.querySelector('.tab-dot'), closing: false, reconnectAttempts: 0, reconnectTimer: null,
          labelEl: tabLabelEl, renamed: false,
        };
        sessions.set(id, session);
        saveSids();
        updateEmptyState();
        updateNewTabBtn();

        connectWs(session);

        term.onData((data) => sendInput(session, data));

        tabEl.addEventListener('click', (e) => {
          if (e.target.closest('.tab-close')) return;
          activateSession(id);
        });
        tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
          e.stopPropagation();
          // Closing sends {type:'kill'} and actually ends the shell (unlike a
          // dropped connection, which just waits out the reconnect grace
          // period) — worth an "are you sure" before that's irreversible.
          if (confirm(`关闭 "${tabLabelEl.textContent}"？这会结束里面正在跑的程序。`)) {
            closeSession(id);
          }
        });

        activateSession(id);
      }

      newTabBtn.addEventListener('click', () => createSession());

      // Debounced: mobile browsers can fire several resize/visualViewport
      // events in quick succession (address bar show/hide, keyboard open/close),
      // and fit()+resize() on every single one is what turns a single real
      // resize into a visible flicker.
      let resizeDebounce = null;
      const handleViewportResize = () => {
        clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => {
          const session = sessions.get(activeId);
          if (session) {
            session.fitAddon.fit();
            sendResize(session);
          }
        }, 80);
      };
      window.addEventListener('resize', handleViewportResize);
      if (window.visualViewport) {
        // the on-screen keyboard resizes the visible area without firing resize
        window.visualViewport.addEventListener('resize', handleViewportResize);
      }

      // Each open tab here is usually a different physical machine (a
      // separate token/link per webcli instance), so an accidental browser
      // tab close is easy to make and — without this — easy to not notice
      // until the reconnect grace period has already run out. The confirm
      // text itself is ignored by modern browsers (they show their own
      // generic "leave site?" wording), but setting returnValue is what
      // actually makes the prompt appear at all.
      window.addEventListener('beforeunload', (e) => {
        if (sessions.size > 0) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Waking from a locked phone or a dead access point should resume
      // immediately rather than waiting out the backoff.
      const resumeNow = () => {
        for (const session of sessions.values()) {
          if (session.closing) continue;
          if (!session.ws || session.ws.readyState > WebSocket.OPEN) {
            if (session.reconnectTimer) clearTimeout(session.reconnectTimer);
            session.reconnectAttempts = 0;
            connectWs(session);
          }
        }
      };
      window.addEventListener('online', resumeNow);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') resumeNow();
      });

      // ---- share / QR ----
      const qrModal = document.getElementById('qr-modal');
      document.getElementById('qr-btn').addEventListener('click', async () => {
        qrModal.classList.add('show');
        document.getElementById('qr-box').innerHTML = '<p>生成中…</p>';
        try {
          const keyQ = secondaryKey ? `&key=${encodeURIComponent(secondaryKey)}` : '';
          const res = await fetch(`/api/share?token=${encodeURIComponent(token)}${keyQ}`);
          const data = await res.json();
          document.getElementById('qr-box').innerHTML = data.qr;
          document.getElementById('qr-url').textContent = data.url;
        } catch {
          document.getElementById('qr-box').innerHTML = '<p>获取失败</p>';
        }
      });
      document.getElementById('qr-close').addEventListener('click', () => qrModal.classList.remove('show'));
      qrModal.addEventListener('click', (e) => {
        if (e.target === qrModal) qrModal.classList.remove('show');
      });

      // ---- drag & drop upload ----
      (function wireDrop() {
        const hint = document.getElementById('drop-hint');
        let depth = 0;
        panesEl.addEventListener('dragenter', (e) => {
          e.preventDefault();
          if (++depth === 1) hint.classList.add('show');
        });
        panesEl.addEventListener('dragover', (e) => e.preventDefault());
        panesEl.addEventListener('dragleave', () => {
          if (--depth <= 0) { depth = 0; hint.classList.remove('show'); }
        });
        panesEl.addEventListener('drop', async (e) => {
          e.preventDefault();
          depth = 0;
          hint.classList.remove('show');
          for (const file of [...(e.dataTransfer.files || [])]) {
            const session = currentSession();
            try {
              const keyQ = secondaryKey ? `&key=${encodeURIComponent(secondaryKey)}` : '';
              const res = await fetch(`/api/upload?token=${encodeURIComponent(token)}${keyQ}`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/octet-stream',
                  'x-webcli-filename': encodeURIComponent(file.name),
                },
                body: file,
              });
              const data = await res.json();
              if (!res.ok) throw new Error(data.error || 'failed');
              if (session) session.term.write(`\r\n\x1b[36m[已上传] ${data.path}\x1b[0m\r\n`);
            } catch (err) {
              if (session) session.term.write(`\r\n\x1b[31m[上传失败] ${err.message}\x1b[0m\r\n`);
            }
          }
        });
      })();

      if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }

      // Reopen whatever is still running server-side; only fall back to a fresh
      // shell when there is nothing to resume.
      (async function restore() {
        let live = [];
        try {
          const keyQ = secondaryKey ? `&key=${encodeURIComponent(secondaryKey)}` : '';
          const res = await fetch(`/api/sessions?token=${encodeURIComponent(token)}${keyQ}`);
          if (res.ok) live = (await res.json()).sessions || [];
        } catch {}
        const known = new Set(loadSids());
        const resumable = live.filter((s) => known.has(s.sid)).sort((a, b) => a.createdAt - b.createdAt);
        if (resumable.length) {
          for (const s of resumable) createSession(s.sid);
        } else {
          createSession();
        }
      })();
      } // end initApp

      function startApp(secondaryKey) {
        if (localStorage.getItem(DEVICE_NAME_STORAGE) !== null) {
          initApp(secondaryKey);
          return;
        }
        const deviceGate = document.getElementById('device-gate');
        deviceGate.style.display = 'flex';
        const finish = (name) => {
          localStorage.setItem(DEVICE_NAME_STORAGE, name);
          deviceGate.style.display = 'none';
          initApp(secondaryKey);
        };
        document.getElementById('device-gate-form').addEventListener('submit', (e) => {
          e.preventDefault();
          finish(document.getElementById('device-input').value.trim().slice(0, 40));
        }, { once: true });
        document.getElementById('device-skip').addEventListener('click', () => finish(''), { once: true });
      }

      const SECONDARY_KEY_STORAGE = 'webcli-secondary-key';
      fetch('/api/auth-status').then((r) => r.json()).then(({ enabled }) => {
        if (!enabled) {
          startApp(null);
          return;
        }
        const stored = sessionStorage.getItem(SECONDARY_KEY_STORAGE);
        if (stored) {
          startApp(stored);
          return;
        }
        document.getElementById('key-gate').style.display = 'flex';
        document.getElementById('key-gate-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const v = document.getElementById('key-input').value.trim();
          if (!v) return;
          sessionStorage.setItem(SECONDARY_KEY_STORAGE, v);
          document.getElementById('key-gate').style.display = 'none';
          startApp(v);
        });
      }).catch(() => startApp(null));
    }
  </script>
</body>
</html>
