<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Without this the page renders at a 980px desktop width and then scales
     down, which makes the terminal unreadably small on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#09090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="webcli">
<meta name="referrer" content="no-referrer">
<title>webcli</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root {
    --bg: #09090b;
    --panel: #18181b;
    --border: #27272a;
    --border-glow: rgba(45, 212, 191, .35);
    --text: #fafafa;
    --muted: #a1a1aa;
    --input-bg: #0f0f11;
    --accent: #14b8a6;
    --accent-hover: #2dd4bf;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  :root[data-theme="light"] {
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #e4e4e7;
    --border-glow: rgba(13, 148, 136, .25);
    --text: #18181b;
    --muted: #71717a;
    --input-bg: #ffffff;
    --accent: #0d9488;
    --accent-hover: #0f766e;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      --bg: #f4f4f5;
      --panel: #ffffff;
      --border: #e4e4e7;
      --border-glow: rgba(13, 148, 136, .25);
      --text: #18181b;
      --muted: #71717a;
      --input-bg: #ffffff;
      --accent: #0d9488;
      --accent-hover: #0f766e;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    /* 100% (and 100vh) on mobile browsers is the "chrome collapsed" size, which
       doesn't match the currently-visible area while the address bar is shown.
       That mismatch lets the page scroll by a hair, which toggles the address
       bar, which fires a resize event, which we react to — a feedback loop
       that reads as the whole UI flickering up and down. 100dvh tracks the
       actual visible viewport instead, so there's nothing to scroll into. */
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    transition: background .15s ease, color .15s ease;
    overflow: hidden;
  }

  /* ---- token gate ---- */
  #gate, #key-gate, #device-gate {
    display: none;
    position: relative;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    overflow: hidden;
  }

  #gate::before {
    content: "";
    position: absolute;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 500px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(20, 184, 166, .16), transparent 70%);
    pointer-events: none;
  }

  .gate-card {
    position: relative;
    z-index: 1;
    width: 320px;
    padding: 32px 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
    box-shadow: 0 0 0 1px var(--border-glow), 0 20px 60px rgba(0, 0, 0, .5);
    text-align: center;
    animation: gate-in .35s ease;
  }

  @keyframes gate-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .gate-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-hover);
    margin-bottom: 8px;
  }

  .gate-title {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .gate-card input {
    width: 100%;
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border-radius: .5rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  .gate-card input:focus { border-color: var(--accent); }

  .gate-card button {
    width: 100%;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: .5rem;
    border: none;
    background: var(--accent);
    color: #04201c;
    cursor: pointer;
    transition: background .15s ease;
  }
  .gate-card button:hover { background: var(--accent-hover); }
  .gate-card .gate-actions { display: flex; gap: 8px; }
  .gate-card .gate-actions button { flex: 1; }
  .gate-card .gate-skip { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .gate-card .gate-skip:hover { background: rgba(255, 255, 255, .06); color: var(--text); }

  /* ---- app chrome ---- */
  #app {
    display: none;
    flex-direction: column;
    height: 100%;
  }

  #chrome {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chrome-title {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-radius: .25rem;
    padding: 2px 4px;
    margin: -2px -4px;
  }
  .chrome-title:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .1); }

  #version-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    opacity: .7;
  }

  .chrome-title-input {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: .25rem;
    padding: 2px 4px;
    margin: -2px -4px;
    outline: none;
    width: 160px;
  }

  /* ---- dropdown panels shared look (connections / settings) ---- */
  .chrome-dropdown-anchor { position: relative; }
  .chrome-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    z-index: 10;
    min-width: 220px;
    max-width: 320px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .5rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    cursor: default;
    opacity: 0;
    visibility: hidden;
    transform: scale(.96) translateY(-4px);
    transform-origin: top right;
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
  }
  .chrome-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1) translateY(0);
    transition: opacity .12s ease, transform .12s ease, visibility 0s linear 0s;
  }

  #connections-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    padding: 3px 7px;
    border-radius: .375rem;
    cursor: pointer;
  }
  #connections-badge:hover { background: rgba(127, 127, 127, .1); color: var(--text); }
  #connections-badge .conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--border-glow);
  }
  .conn-row {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 6px 8px;
    border-radius: .375rem;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .conn-row:hover { background: rgba(127, 127, 127, .1); }
  .conn-row .conn-device { color: var(--text); }
  .conn-row .conn-meta { color: var(--muted); font-size: 10px; }

  #settings-btn, #quickcmd-btn {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: .375rem;
    padding: 5px 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  #settings-btn { font-size: 15px; font-weight: 400; }
  #settings-btn:hover, #quickcmd-btn:hover { background: rgba(127, 127, 127, .1); color: var(--text); }

  /* Desktop/default: widget is just an inline flex row (chips + "+"), no
     dropdown chrome at all. The mobile media query below turns it into a
     collapsed "命令" trigger + dropdown grid instead. */
  #quickcmd-widget { display: flex; align-items: center; }
  #quickcmd-toggle { display: none; }
  #quickcmd-panel { display: flex; align-items: center; gap: 5px; }
  #quickcmd-divider { display: none; }

  #quickcmd-bar { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; overflow-x: auto; max-width: 40vw; }
  .quickcmd-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: .375rem;
    padding: 4px 6px 4px 9px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .quickcmd-chip:hover { background: rgba(127, 127, 127, .1); color: var(--text); }
  .quickcmd-chip .quickcmd-chip-label {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .quickcmd-chip .quickcmd-chip-del {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 1px 2px;
    border-radius: .25rem;
  }
  .quickcmd-chip .quickcmd-chip-del:hover { color: var(--text); background: rgba(127, 127, 127, .2); }

  /* ---- add-quick-command modal ---- */
  #quickcmd-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .7);
    padding: 20px;
  }
  #quickcmd-modal.show { display: flex; }
  #quickcmd-modal .quickcmd-card {
    width: min(320px, 100%);
    max-height: 90dvh;
    overflow: auto;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
  }
  #quickcmd-modal h3 { margin: 0 0 14px; font-size: 15px; color: var(--text); }
  #quickcmd-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .quickcmd-preset {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: .375rem;
    padding: 4px 8px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .quickcmd-preset:hover { background: rgba(127, 127, 127, .1); color: var(--text); }
  #quickcmd-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #quickcmd-form input {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 9px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #quickcmd-form input:focus { border-color: var(--accent); }
  #quickcmd-modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  #quickcmd-modal-actions button { flex: 1; }
  #quickcmd-form button[type="submit"] {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 7px;
    border-radius: .375rem;
    border: none;
    background: var(--accent);
    color: #04201c;
    cursor: pointer;
  }
  #quickcmd-form button[type="submit"]:hover { background: var(--accent-hover); }
  #quickcmd-cancel {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 7px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  #quickcmd-cancel:hover { background: rgba(127, 127, 127, .1); color: var(--text); }

  #settings-dropdown .settings-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 2px 4px 6px;
  }
  .theme-switch, .action-row {
    display: flex;
    gap: 3px;
    padding: 3px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: .375rem;
  }
  .theme-switch button, .action-row button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 4px;
    border-radius: .3rem;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .theme-switch button:hover, .action-row button:hover { color: var(--text); }
  .theme-switch button.active { background: var(--accent); color: #04201c; }
  .settings-divider { height: 1px; background: var(--border); margin: 8px 2px; }
  #version-info {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    padding: 0 4px;
  }
  #service-action-status {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    padding: 6px 4px 0;
    min-height: 1.4em;
  }

  #copy-link-btn {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent-hover);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  #copy-link-btn:hover { background: rgba(45, 212, 191, .12); border-color: var(--accent); }
  #copy-link-btn.copied { color: var(--accent); border-color: var(--accent); }

  /* ---- tab bar ---- */
  #tabbar {
    display: flex;
    align-items: stretch;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }

  #tabs { display: flex; }

  .tab {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 8px 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .tab.active { color: var(--text); background: var(--bg); }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--accent);
  }

  .tab-label-input {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--accent);
    border-radius: .25rem;
    padding: 1px 3px;
    outline: none;
    width: 100px;
  }

  .tab-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #71717a;
    flex-shrink: 0;
  }
  .tab-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--border-glow); }
  .tab-dot.disconnected { background: #f59e0b; animation: dot-pulse 1.2s ease-in-out infinite; }

  @keyframes dot-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .tab-close {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 3px;
    border-radius: .25rem;
  }
  .tab-close:hover { color: var(--text); background: rgba(255, 255, 255, .08); }

  #new-tab-btn {
    flex-shrink: 0;
    width: 34px;
    border: none;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }
  #new-tab-btn:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .08); }
  #new-tab-btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ---- terminal panes ---- */
  #panes {
    position: relative;
    flex: 1;
    min-height: 0;
    background: var(--bg);
  }

  .pane {
    position: absolute;
    inset: 0;
    /* viewport-fit=cover lets the page draw under the iOS home-indicator
       gesture bar; without this, the terminal's last row renders right
       under it and ends up half-covered/hard to tap. */
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .15s ease, visibility 0s linear .15s;
  }
  .pane.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity .15s ease, visibility 0s linear 0s;
  }

  #empty-state {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: var(--muted);
  }
  #empty-state.show { display: flex; }
  #empty-state .empty-icon {
    font-family: var(--font-mono);
    font-size: 30px;
    color: var(--border);
    margin-bottom: 2px;
  }
  #empty-state .empty-title {
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text);
  }
  #empty-state .empty-hint {
    font-family: var(--font-mono);
    font-size: 12px;
  }

  /* ---- search overlay ---- */
  #search-bar {
    display: none;
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .5rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  }
  #search-bar.show { display: flex; }
  #search-bar input {
    width: 160px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 6px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #search-bar input:focus { border-color: var(--accent); }
  #search-bar button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: .25rem;
  }
  #search-bar button:hover { color: var(--accent-hover); background: rgba(45, 212, 191, .1); }

  /* ---- mobile key row ---- */
  #mobile-keys {
    display: none;
    gap: 6px;
    padding: 6px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  #mobile-keys button {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: .375rem;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    cursor: pointer;
  }
  #mobile-keys button:active { background: rgba(45, 212, 191, .15); border-color: var(--accent); }
  /* Ctrl/Alt latch on until the next keypress, so two-finger chords aren't
     needed on a touchscreen. */
  #mobile-keys button.sticky-on {
    background: var(--accent);
    color: #04201c;
    border-color: var(--accent);
  }
  #mobile-keys::-webkit-scrollbar { display: none; }

  @media (max-width: 700px) {
    #mobile-keys { display: flex; }
    #mobile-keys button { min-width: 42px; padding: 9px 12px; }

    /* Title + version + connections/settings/qr/copy-link might not all fit
       on one row on a phone — wrap to a second line instead. (Not
       overflow-x:auto: that would also clip the settings/connections/
       quick-command dropdowns, which are absolutely positioned inside this
       same element and popped below it.) */
    #chrome { flex-wrap: wrap; row-gap: 6px; }
    #chrome > * { flex-shrink: 0; }

    /* Quick commands collapse into a single "命令" trigger + dropdown grid
       instead of a row of chips, so they don't eat header width on a phone. */
    #quickcmd-toggle { display: inline-flex; align-items: center; justify-content: center; }
    #quickcmd-panel {
      position: absolute;
      top: calc(100% + 8px);
      /* left, not right: the widget sits near the left edge of the header,
         so anchoring to its right edge and growing leftward (like the
         connections/settings dropdowns do, which sit near the right edge)
         would push this off the left side of the screen. */
      left: 0;
      z-index: 10;
      display: block;
      /* fixed (not min/max) width so the grid below has an unambiguous size
         to divide into columns, instead of shrink-to-fit guessing low */
      width: 260px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: .5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      opacity: 0;
      visibility: hidden;
      transform: scale(.96) translateY(-4px);
      transform-origin: top left;
      transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
    }
    #quickcmd-panel.show {
      opacity: 1;
      visibility: visible;
      transform: scale(1) translateY(0);
      transition: opacity .12s ease, transform .12s ease, visibility 0s linear 0s;
    }
    #quickcmd-divider { display: block; margin: 8px 2px; }
    #quickcmd-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: none;
      overflow: visible;
    }
    .quickcmd-chip { justify-content: center; }
    .quickcmd-chip .quickcmd-chip-label { max-width: 52px; }
    #quickcmd-btn { display: flex; width: 100%; justify-content: center; }
  }
  #mobile-keys.force-show { display: flex; }
  #mobile-keys.force-hide { display: none; }

  /* ---- drag & drop upload ---- */
  #drop-hint {
    display: none;
    position: absolute;
    inset: 8px;
    z-index: 20;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--accent);
    border-radius: .75rem;
    background: rgba(20, 184, 166, .1);
    color: var(--accent-hover);
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
  }
  #drop-hint.show { display: flex; }

  /* ---- reload banner (server restarting) ---- */
  #reload-banner {
    display: none;
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    max-width: min(90vw, 420px);
    padding: 8px 16px;
    border-radius: .5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    text-align: center;
  }
  #reload-banner.show { display: block; }

  /* ---- share / QR modal ---- */
  #qr-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .7);
    padding: 20px;
  }
  #qr-modal.show { display: flex; }
  #qr-modal .qr-card {
    width: min(340px, 100%);
    max-height: 90dvh;
    overflow: auto;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .75rem;
    text-align: center;
  }
  #qr-modal h3 { margin: 0 0 4px; font-size: 15px; color: var(--text); }
  #qr-modal p { margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  #qr-modal svg { width: 100%; height: auto; border-radius: .5rem; background: #fff; }
  #qr-url {
    margin: 12px 0;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    word-break: break-all;
    color: var(--muted);
    background: var(--input-bg);
    border-radius: .375rem;
  }
</style>
<script src="/theme-init.js"></script>
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">Enter access token</div>
      <form id="gate-form">
        <input id="token-input" type="password" autocomplete="off" autofocus>
        <button type="submit">Connect</button>
      </form>
    </div>
  </div>

  <div id="key-gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">Enter secondary key</div>
      <form id="key-gate-form">
        <input id="key-input" type="password" autocomplete="off" autofocus>
        <button type="submit">Continue</button>
      </form>
    </div>
  </div>

  <div id="device-gate">
    <div class="gate-card">
      <div class="gate-label">webcli</div>
      <div class="gate-title">这台设备叫什么名字？<br>（方便对方知道是谁连上来了，可不填）</div>
      <form id="device-gate-form">
        <input id="device-input" type="text" maxlength="40" autocomplete="off" autofocus placeholder="比如：我的 iPhone">
        <div class="gate-actions">
          <button type="button" class="gate-skip" id="device-skip">跳过</button>
          <button type="submit">确定</button>
        </div>
      </form>
    </div>
  </div>

  <div id="app">
    <div id="chrome">
      <span class="chrome-title" id="chrome-title" title="点击重命名">webcli</span>
      <span id="version-badge" title="点击 ⋯ 菜单看提交号和时间"></span>
      <div id="quickcmd-widget" class="chrome-dropdown-anchor">
        <button id="quickcmd-toggle" type="button" title="快捷命令">命令</button>
        <div id="quickcmd-panel">
          <div id="quickcmd-bar"></div>
          <div class="settings-divider" id="quickcmd-divider"></div>
          <button id="quickcmd-btn" type="button" title="新增快捷命令">+</button>
        </div>
      </div>
      <div id="connections-badge" class="chrome-dropdown-anchor" title="点击查看当前连接">
        <span class="conn-dot"></span>
        <span id="conn-count">1</span>
        <div id="connections-dropdown" class="chrome-dropdown"></div>
      </div>
      <div id="settings-badge" class="chrome-dropdown-anchor">
        <button id="settings-btn" type="button" title="设置">&#8943;</button>
        <div id="settings-dropdown" class="chrome-dropdown">
          <div class="settings-label">主题</div>
          <div class="theme-switch">
            <button type="button" data-theme-choice="auto">跟随系统</button>
            <button type="button" data-theme-choice="light">浅色</button>
            <button type="button" data-theme-choice="dark">深色</button>
          </div>
          <div class="settings-divider"></div>
          <div id="version-info"></div>
          <div class="settings-divider"></div>
          <div class="settings-label">服务</div>
          <div class="action-row">
            <button type="button" id="update-btn">更新代码</button>
            <button type="button" id="restart-btn">重启服务</button>
          </div>
          <div id="service-action-status" class="settings-meta"></div>
        </div>
      </div>
      <button id="qr-btn" type="button" title="扫码在手机上打开">&#9636;</button>
      <button id="copy-link-btn" type="button">复制链接</button>
    </div>
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="new-tab-btn" type="button" title="New terminal">+</button>
    </div>
    <div id="mobile-keys">
      <button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-sticky="ctrl">Ctrl</button>
      <button type="button" data-sticky="alt">Alt</button>
      <button type="button" data-key="ctrl-c">^C</button>
      <button type="button" data-key="ctrl-d">^D</button>
      <button type="button" data-key="ctrl-z">^Z</button>
      <button type="button" data-key="clear" title="清屏 / clear screen">Clear</button>
      <button type="button" data-key="left">&larr;</button>
      <button type="button" data-key="up">&uarr;</button>
      <button type="button" data-key="down">&darr;</button>
      <button type="button" data-key="right">&rarr;</button>
      <button type="button" data-key="home">Home</button>
      <button type="button" data-key="end">End</button>
      <button type="button" data-key="pgup">PgUp</button>
      <button type="button" data-key="pgdn">PgDn</button>
      <button type="button" data-key="dash">-</button>
      <button type="button" data-key="underscore">_</button>
      <button type="button" data-key="slash">/</button>
      <button type="button" data-key="pipe">|</button>
      <button type="button" data-key="tilde">~</button>
      <button type="button" data-key="star">*</button>
    </div>
    <div id="panes">
      <div id="empty-state">
        <div class="empty-icon">&gt;_</div>
        <div class="empty-title">还没有打开的终端</div>
        <div class="empty-hint">点击左上角 <strong>+</strong> 开一个</div>
      </div>
      <div id="drop-hint">松手上传到 ~/webcli-uploads</div>
      <div id="reload-banner"></div>
      <div id="qr-modal">
        <div class="qr-card">
          <h3>扫码在手机上打开</h3>
          <p>链接含 token，请勿公开分享</p>
          <div id="qr-box"></div>
          <div id="qr-url"></div>
          <button id="qr-close" type="button">关闭</button>
        </div>
      </div>
      <div id="quickcmd-modal">
        <div class="quickcmd-card">
          <h3>新增快捷命令</h3>
          <div id="quickcmd-presets"></div>
          <form id="quickcmd-form">
            <input id="quickcmd-label-input" type="text" placeholder="名称" maxlength="20" autocomplete="off" required>
            <input id="quickcmd-command-input" type="text" placeholder="命令内容" maxlength="200" autocomplete="off" required>
            <input id="quickcmd-cwd-input" type="text" placeholder="工作目录（可选）" maxlength="200" autocomplete="off">
            <div id="quickcmd-modal-actions">
              <button type="button" id="quickcmd-cancel">取消</button>
              <button type="submit">添加</button>
            </div>
          </form>
        </div>
      </div>
      <div id="search-bar">
        <input id="search-input" type="text" placeholder="Find in terminal…" autocomplete="off">
        <button id="search-prev" type="button" title="Previous match">&uarr;</button>
        <button id="search-next" type="button" title="Next match">&darr;</button>
        <button id="search-close" type="button" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script src="/vendor/addon-search.js"></script>
  <script src="/app.js"></script>
</body>
</html>
